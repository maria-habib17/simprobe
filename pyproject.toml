[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simprobe"
version = "0.1.0"
description = "Research tooling for cohort-conditioned diagnostics of source-code similarity."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Maria Habib" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["simprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]